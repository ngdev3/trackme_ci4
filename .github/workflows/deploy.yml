name: Deploy to Hostinger

# Runs on every push to main, and can be triggered by hand from the
# Actions tab (Run workflow). Builds vendor/ on the SERVER's PHP version
# (8.2) in the cloud runner — plenty of memory, correct platform — then
# syncs the finished app to Hostinger over rsync/SSH. The server never runs
# composer, so the OOM + PHP-version problems can't happen; rsync only
# transfers changed files, so deploying vendor/ is fast and reliable
# (unlike FTP, which chokes on tens of thousands of tiny vendor files).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Match the server exactly (Hostinger = PHP 8.2). This guarantees
      # vendor/composer/platform_check.php targets 8.2, not 8.3.
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysqli, gd, zip, curl
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # rsync the built app to the site root. -a preserves structure; we skip
      # perms/owner (shared hosting sets its own). Excludes keep server-only
      # files intact: runtime secrets, uploads, logs, sessions, cache, CI meta.
      # NOTE: no --delete, matching the previous FTP behaviour (won't remove
      # server files). Add --delete later if you want a strict mirror.
      - name: Deploy over rsync/SSH
        run: |
          rsync -rlz --no-perms --no-owner --no-group --omit-dir-times \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='env' \
            --exclude='deploy' \
            --exclude='writable' \
            --exclude='tests' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
